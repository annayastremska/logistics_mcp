<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origin — import sourcing risk</title>
<style>
/* =====================================================================
   DESIGN PLAN (built to it, not decorated onto it)

   Subject      Ukrainian food importer screening supply concentration.
                Its world is the customs manifest: HS codes, bills of
                lading, weight tickets, and the origin stencilled on the
                side of a crate.

   Signature    The origin stencil. The lead supplier and its share are
                set the way an origin is actually marked on produce
                crates: DIN, caps, tracked out, inside a stencil frame,
                with the code and tonnage as a manifest line beneath.
                One per entry, and it is the thing you remember.

   Type         Bahnschrift (DIN 1451) for figures, stencils and eyebrows
                  -- the typeface of European freight and signage, so the
                  page speaks the vernacular of the goods it describes.
                Corbel for prose. Consolas for codes: a code should look
                  like a code, not like a word.

   Colour       "Carbon copy" -- the cool grey-blue of a duplicate form,
                ink navy, and a stamp red spent only on single-source.
                Deliberately not cream-and-terracotta, not near-black
                with an acid accent.

   Default check: cream/serif/terracotta -> no. Near-black/acid -> no.
   Broadsheet hairlines -> adjacent, since a manifest also rules its
   columns, so the stencil is made dominant and there are no newspaper
   columns of text anywhere.

   Contrast measured, not judged. Light: ink 16.2:1, ink-2 7.1, ink-3
   3.41, stamp 7.2, hold 5.8, watch 5.8, clear 6.3 on the sheet; every
   interactive border 3.4. Dark steps re-measured against the dark sheet.
   ===================================================================== */

:root {
  color-scheme: light;
  --sheet:   #fbfcfc;   /* the form itself */
  --form:    #eef0f1;   /* duplicate-copy ground */
  --form-2:  #e4e8ea;
  --ink:     #11202b;
  --ink-2:   #46596a;
  --ink-3:   #7b8b98;
  --rule:    #d5dade;
  --control: #7b8b98;   /* 3.41:1 */
  --stamp:   #a5231d;   /* single source */
  --hold:    #8a5a10;   /* concentrated */
  --watch:   #6f6412;   /* moderate, volatile */
  --clear:   #1c6b45;   /* spread */
  --din: "Bahnschrift", "Bahnschrift SemiCondensed", "DIN Alternate",
         "Franklin Gothic Medium", "Arial Narrow", system-ui, sans-serif;
  --body: Corbel, Candara, "Segoe UI", system-ui, sans-serif;
  --code: Consolas, "Cascadia Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --sheet: #141a1f; --form: #1b2329; --form-2: #222b32;
    --ink: #eef2f4; --ink-2: #a3b2bd; --ink-3: #7b8b98;
    --rule: #28323a; --control: #7b8b98;
    --stamp: #f08f88; --hold: #e0a75c; --watch: #cfc264; --clear: #79c9a0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --sheet: #141a1f; --form: #1b2329; --form-2: #222b32;
  --ink: #eef2f4; --ink-2: #a3b2bd; --ink-3: #7b8b98;
  --rule: #28323a; --control: #7b8b98;
  --stamp: #f08f88; --hold: #e0a75c; --watch: #cfc264; --clear: #79c9a0;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--form); color: var(--ink);
  display: flex; flex-direction: column;
  font: 14px/1.5 var(--body);
  font-variant-numeric: tabular-nums;
}
h1,h2,h3 { margin: 0; font-weight: 600; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* eyebrow: DIN caps, tracked. Used for every field label on the page. */
.eb {
  font-family: var(--din); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .16em; color: var(--ink-3);
}
.code { font-family: var(--code); font-size: 11px; color: var(--ink-3); }

.wrap { max-width: 1120px; margin: 0 auto; width: 100%; padding: 0 24px; }

/* ---------------- masthead: a document header, not a hero ---------------- */
header { background: var(--sheet); border-bottom: 2px solid var(--ink); }
header .wrap { display: flex; align-items: flex-end; gap: 18px; padding: 14px 24px 10px; }
.mark { font-family: var(--din); font-size: 19px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.mark small { display: block; font-family: var(--body); font-size: 11px; font-weight: 400;
              letter-spacing: 0; text-transform: none; color: var(--ink-2); margin-top: 1px; }
.grow { flex: 1; }
.ref { text-align: right; }
.ref .v { font-family: var(--din); font-size: 13px; letter-spacing: .05em; }

button {
  appearance: none; font: inherit; font-size: 13px; cursor: pointer;
  height: 28px; padding: 0 12px; border: 1px solid var(--control);
  border-radius: 2px; background: var(--sheet); color: var(--ink);
}
button:hover { background: var(--form-2); }
button.q { border-color: transparent; background: none; color: var(--ink-2); }
button.q:hover { color: var(--ink); background: var(--form-2); }
button.go {
  background: var(--ink); border-color: var(--ink); color: var(--sheet);
  font-family: var(--din); letter-spacing: .1em; text-transform: uppercase; font-size: 11px; font-weight: 600;
}
button:disabled { opacity: .45; cursor: default; }

/* ---------------- header fields: the manifest's own summary ---------------- */
.fields { background: var(--sheet); border-bottom: 1px solid var(--rule); }
.fields .wrap { display: flex; flex-wrap: wrap; padding: 0 24px; }
.fld { padding: 11px 26px 12px 0; margin-right: 26px; border-right: 1px solid var(--rule); }
.fld:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
.fld .v { font-family: var(--din); font-size: 22px; font-weight: 600; letter-spacing: .01em; line-height: 1.1; margin-top: 3px; }
.fld .v s { text-decoration: none; font-family: var(--body); font-size: 12px; font-weight: 400;
            letter-spacing: 0; color: var(--ink-2); margin-left: 6px; }
.fld.hot .v { color: var(--stamp); }

.tools { display: flex; align-items: center; gap: 12px; padding: 16px 0 14px; }
.seg { display: inline-flex; border: 1px solid var(--control); border-radius: 2px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; height: 26px; color: var(--ink-2);
              font-family: var(--din); letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

/* ---------------- entries ---------------- */
.list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 820px) { .list { grid-template-columns: 1fr; } }

/* A div, not a button: a button does not take its height from nested flex or
   grid children in Chromium, and every entry collapsed to one line. Role and
   tabindex restore the semantics; keydown restores the keyboard. */
.entry {
  text-align: left; cursor: pointer; font: inherit;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 2px;
  padding: 0; display: flex; flex-direction: column;
  border-top: 3px solid currentColor;
}
.entry:hover { background: var(--form-2); }
.entry.wide { grid-column: span 2; }
@media (max-width: 820px) { .entry.wide { grid-column: span 1; } }
.s-stamp { color: var(--stamp); } .s-hold { color: var(--hold); }
.s-watch { color: var(--watch); } .s-clear { color: var(--clear); }

.entry .head {
  display: flex; align-items: baseline; gap: 10px;
  padding: 11px 16px 10px; border-bottom: 1px solid var(--rule);
}
.entry .nm {
  font-family: var(--din); font-size: 15px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
}
.entry .head .code { margin-left: auto; }

.body { display: flex; gap: 18px; padding: 14px 16px 15px; align-items: flex-start; }

/* THE SIGNATURE — an origin stencil, as marked on a crate */
.stencil {
  flex: none; width: 186px; padding: 11px 13px 12px;
  border: 1.5px solid var(--ink); border-radius: 1px;
  background: var(--sheet);
}
.entry.wide .stencil { width: 232px; }
.stencil .org {
  font-family: var(--din); font-weight: 700; text-transform: uppercase;
  letter-spacing: .2em; font-size: 15px; color: var(--ink); line-height: 1.15;
  word-break: break-word;
}
.entry.wide .stencil .org { font-size: 18px; }
.stencil .pc {
  font-family: var(--din); font-weight: 700; font-size: 38px; line-height: 1;
  letter-spacing: -0.01em; margin-top: 9px; color: var(--ink);
}
.entry.wide .stencil .pc { font-size: 52px; }
.stencil .mf {
  font-family: var(--code); font-size: 10px; color: var(--ink-2) !important;
  margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--control);
  letter-spacing: .02em;
}
/* The share, filled in the line's own tone against a neutral remainder --
   not the other way round. */
.stencil .rule { height: 3px; background: var(--rule); margin-top: 10px; }
.stencil .rule i { display: block; height: 100%; background: currentColor; }

/* tally: the figures, as a form's field list */
.tally { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: baseline; }
.tally dt { white-space: nowrap; }
.tally dd { margin: 0; font-family: var(--din); font-size: 15px; font-weight: 600;
             letter-spacing: .01em; color: var(--ink); }
.tally dd em { font-style: normal; font-family: var(--body); font-size: 11.5px; font-weight: 400; color: var(--ink-2); margin-left: 5px; letter-spacing: 0; }

.cond { padding: 0 16px 14px; display: flex; align-items: center; gap: 9px; }
.cond .w { font-family: var(--din); font-size: 11.5px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; }
.cond .more { font-size: 11.5px; color: var(--ink-3); }
.cond::before { content: ""; width: 14px; height: 3px; background: currentColor; flex: none; }

/* alternatives, only on the lead entry */
.alt { margin: 0 16px 15px; border-top: 1px solid var(--rule); padding-top: 11px; }
.alt table { width: 100%; border-collapse: collapse; }
.alt td { padding: 3px 0; font-size: 13px; color: var(--ink-2); }
.alt td.r { text-align: right; font-family: var(--din); font-weight: 600; color: var(--ink); }
.alt .after { font-size: 11.5px; color: var(--ink-3); margin-top: 7px; }

/* ---------------- line sheet ---------------- */
.crumbs { display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 2px; margin-bottom: 14px; }
.sheet > .cap { padding: 11px 16px; border-bottom: 2px solid var(--ink); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sheet > .cap .t { font-family: var(--din); font-size: 13px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; }
.sheet > .bd { padding: 15px 16px; }
table.man { width: 100%; border-collapse: collapse; }
table.man th { text-align: left; padding: 8px 16px; border-bottom: 1px solid var(--rule); }
table.man td { padding: 0 16px; height: 33px; border-bottom: 1px solid var(--rule); font-size: 13px; }
table.man tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--form) 55%, transparent); }
table.man tr:last-child td { border-bottom: 0; }
table.man td.r, table.man th.r { text-align: right; }
table.man td.n { font-family: var(--din); font-weight: 600; font-size: 14px; }
.lead-tag { font-family: var(--din); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--stamp); }

details { border-top: 1px solid var(--rule); }
details summary { list-style: none; cursor: pointer; padding: 10px 16px; display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-size: 13px; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: "+"; font-family: var(--code); color: var(--ink-3); }
details[open] summary::before { content: "\2212"; }
details summary:hover { color: var(--ink); background: var(--form-2); }
details .bd { padding: 4px 16px 16px; }

.note { font-size: 12px; color: var(--ink-3); }
.flag { border-left: 3px solid var(--watch); padding: 9px 12px; font-size: 12px; color: var(--ink-2); background: var(--form); }
.log { font-family: var(--code); font-size: 11.5px; }
.log div { padding: 2px 0; color: var(--ink-2); }
.log .bad { color: var(--stamp); }
.out { white-space: pre-wrap; font-size: 14px; line-height: 1.6; }

.ask { background: var(--sheet); border-top: 1px solid var(--rule); padding: 11px 0; margin-top: auto; }
.ask .wrap { display: flex; gap: 9px; align-items: center; }
.ask input { flex: 1; font: inherit; font-size: 14px; height: 30px; padding: 0 11px;
             border: 1px solid var(--control); border-radius: 2px; background: var(--sheet); color: var(--ink); }
.qa .q { font-size: 12.5px; color: var(--ink-3); margin-top: 13px; }
.qa .a { white-space: pre-wrap; margin-top: 3px; }

#main { flex: 1 1 auto; padding-bottom: 26px; }
.hide { display: none !important; }
.sk { background: var(--sheet); border: 1px solid var(--rule); height: 168px; }
@media (prefers-reduced-motion: no-preference) {
  .entry { transition: background .12s linear; }
}
</style>
</head>
<body>

<header><div class="wrap">
  <span class="mark">Origin<small>Import sourcing risk, Ukraine</small></span>
  <span class="grow"></span>
  <span class="ref"><span class="eb">Period</span><div class="v" id="period">&#8212;</div></span>
  <button class="q" id="sysBtn">Sources</button>
</div></header>

<div class="fields"><div class="wrap" id="fields"></div></div>

<div id="main"><div class="wrap">
  <section id="vList">
    <div class="tools">
      <div class="seg">
        <button id="segAll" aria-pressed="true">All lines</button>
        <button id="segRisk" aria-pressed="false">Single source</button>
      </div>
      <span class="note" id="cnt"></span>
      <span class="grow"></span>
      <button class="q" id="refresh">Refresh</button>
    </div>
    <div class="list" id="list"></div>
    <div class="sheet" style="margin-top:14px">
      <details id="sysWrap"><summary>Data sources and connections</summary>
        <div class="bd" id="sysBody">checking&#8230;</div></details>
    </div>
  </section>

  <section id="vLine" class="hide">
    <div class="crumbs"><button class="q" id="back">&#8592; All lines</button>
      <span class="eb" id="crumb"></span></div>
    <div id="lineBody"></div>
  </section>
</div></div>

<div class="ask"><div class="wrap">
  <input id="ask" placeholder="Ask about these lines" autocomplete="off">
  <button class="go" id="askBtn">Ask</button>
</div></div>
<div class="wrap qa" id="qa"></div>

<script>
"use strict";

/* Server enums are not buyer language. Each maps to a word that can be acted
   on, a severity, and whether it belongs on the entry face; the rest surface
   on the line sheet. */
const COND = {
  SINGLE_SOURCE:          { w: "Single source", c: "s-stamp", rank: 4, face: true,
                            why: "One country supplies over 70% of this line." },
  HIGH_CONCENTRATION:     { w: "Concentrated",  c: "s-hold",  rank: 3, face: true,
                            why: "Supply sits with very few countries." },
  MODERATE_CONCENTRATION: { w: "Moderate",      c: "s-watch", rank: 2, face: true,
                            why: "Supply is moderately concentrated." },
  VOLATILE_SUPPLY:        { w: "Volumes swing", c: "s-watch", rank: 2, face: false,
                            why: "Volumes move sharply year to year." },
  MIRROR_DISCREPANCY:     { w: "Reporting gap", c: "s-watch", rank: 1, face: false,
                            why: "Partner export reports disagree with Ukraine's import figures." },
  THIN_DATA:              { w: "Thin data",     c: "s-watch", rank: 1, face: false,
                            why: "Too few reporting origins to be confident." },
};
const ATTENTION = 4;
let data = null, riskOnly = false, live = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const usd = (v) => v == null ? "—"
  : v >= 1e9 ? "$" + (v/1e9).toFixed(1) + "bn"
  : v >= 1e6 ? "$" + (v/1e6).toFixed(0) + "m"
  : v >= 1e3 ? "$" + (v/1e3).toFixed(0) + "k" : "$" + v.toFixed(0);
const pct = (v, d = 0) => v == null ? "—" : v.toFixed(d) + "%";
const n = (v, d = 0) => v == null ? "—" : v.toLocaleString("en-US", { maximumFractionDigits: d });
const tonnes = (kg) => kg == null ? null : n(kg / 1000) + " t";

const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const period = (l) => {
  if (!l) return "";
  const one = p => MON[+p.slice(4)-1] + " " + p.slice(0,4);
  const m = String(l).match(/^(\d{6})-(\d{6})$/);
  return m ? one(m[1]) + " – " + one(m[2]) : String(l);
};

/* Money the lead supplier controls. Ranking on share alone puts a $19m line
   above a $231m one, which is backwards for allocating attention. */
const atRisk = (r) => (r.total_value_usd == null || r.top_partner_share_pct == null)
  ? null : r.total_value_usd * r.top_partner_share_pct / 100;
const conds = (r) => (r.flags || []).map(f => COND[f]).filter(Boolean).sort((a,b) => b.rank - a.rank);
const face = (r) => conds(r).find(c => c.face) || null;
const shortName = (r) => r.label.replace(/,\s*(fresh|shelled|in shell)$/i, "");

/* ---------------- manifest header ---------------- */
function fields() {
  const rows = data.rows.filter(r => r.top_partner_share_pct != null);
  const total = rows.reduce((s,r) => s + (r.total_value_usd||0), 0);
  const risk  = rows.reduce((s,r) => s + (atRisk(r)||0), 0);
  const byLead = {};
  rows.forEach(r => (byLead[r.top_partner_name || r.top_partner_iso3] ??= []).push(r));
  const top = Object.entries(byLead).sort((a,b) => b[1].length - a[1].length)[0];
  const topRisk = top ? top[1].reduce((s,r) => s + (atRisk(r)||0), 0) : 0;

  const f = (k, v, s, hot) => '<div class="fld' + (hot ? " hot" : "") + '"><span class="eb">' + k +
    '</span><div class="v">' + v + (s ? "<s>" + s + "</s>" : "") + "</div></div>";

  $("fields").innerHTML =
    f("Lines", rows.length, "tracked") +
    f("Declared imports", usd(total)) +
    f("Held by one origin", usd(risk), total ? Math.round(risk/total*100) + "% of value" : "", true) +
    (top && top[1].length > 1
      ? f("Concentrated on", esc(top[0]).toUpperCase(), top[1].length + " lines · " + usd(topRisk))
      : "") +
    f("Single source", rows.filter(r => (r.severity||0) >= ATTENTION).length, "of " + rows.length);
  $("period").textContent = period(data.period_label);
}

/* ---------------- entries ---------------- */
const visible = () => data.rows
  .filter(r => !riskOnly || (r.severity||0) >= ATTENTION)
  .sort((a,b) => (b.severity - a.severity) || ((atRisk(b)||0) - (atRisk(a)||0)));

function entry(r, wide) {
  const h = face(r), cls = h ? h.c : "s-clear";
  const rest = conds(r).length - (h ? 1 : 0);
  const share = r.top_partner_share_pct;
  const org = (r.top_partner_name || r.top_partner_iso3 || "—").toUpperCase();

  const tally = [
    ["At risk", usd(atRisk(r)), ""],
    ["Real alternatives", n(r.effective_partner_count, 1), "of " + n(r.partner_count) + " reporting"],
    ["Declared imports", usd(r.total_value_usd), ""],
    ["Volume swing", pct(r.yoy_volatility_pct, 0), "year on year"],
  ].map(x => '<dt class="eb">' + x[0] + '</dt><dd>' + x[1] +
             (x[2] ? '<em>' + x[2] + '</em>' : "") + '</dd>').join("");

  return '<div class="entry ' + cls + (wide ? " wide" : "") + '" role="button" tabindex="0"' +
    ' aria-label="' + esc(shortName(r)) + ', ' + pct(share) + ' from ' + esc(org) + '"' +
    ' data-hs="' + esc(r.hs_code) + '">' +
    '<div class="head"><span class="nm">' + esc(shortName(r)) + '</span>' +
      '<span class="eb">' + esc(r.group) + (r.status !== "ok" ? " · incomplete" : "") + '</span>' +
      '<span class="code">HS ' + esc(r.hs_code) + '</span></div>' +
    '<div class="body">' +
      /* the signature: origin marked as it would be on the crate */
      '<div class="stencil"><div class="org">' + esc(org) + '</div>' +
        '<div class="pc">' + pct(share) + '</div>' +
        '<div class="rule"><i style="width:' + Math.min(100, share||0) + '%"></i></div>' +
        '<div class="mf">' + esc(r.hs_code) + ' · ' + (r.top_partner_iso3 || "") +
          ' · ' + usd(atRisk(r)) + '</div>' +
      '</div>' +
      '<dl class="tally">' + tally + '</dl>' +
    '</div>' +
    '<div class="cond"><span class="w">' + (h ? h.w : "Spread") + '</span>' +
      (rest > 0 ? '<span class="more">+' + rest + ' more on the sheet</span>' : "") + '</div>' +
    (wide ? '<div class="alt" id="alt-' + esc(r.hs_code) + '">' +
            '<span class="eb">Already arriving from</span>' +
            '<div class="note" style="margin-top:6px">loading&#8230;</div></div>' : "") +
    '</div>';
}

function renderList() {
  const rows = visible();
  $("list").innerHTML = rows.length
    ? rows.map((r,i) => entry(r, i === 0)).join("")
    : '<div class="entry s-clear" style="cursor:default"><div class="body"><span class="note">No line matches.</span></div></div>';
  $("cnt").textContent = rows.length + " of " + data.rows.length + " shown";
  $("segAll").setAttribute("aria-pressed", String(!riskOnly));
  $("segRisk").setAttribute("aria-pressed", String(riskOnly));
  $("list").querySelectorAll(".entry[data-hs]").forEach(el => {
    const open = () => openLine(el.dataset.hs);
    el.addEventListener("click", open);
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
    });
  });
  if (rows[0]) fillAlt(rows[0].hs_code);
}

/* The lead entry earns its width by answering "where else?" up front. */
async function fillAlt(hs) {
  const host = $("alt-" + hs);
  if (!host) return;
  const cap = '<span class="eb">Already arriving from</span>';
  try {
    const d = await (await fetch("/api/commodity/" + hs + "?year=2024")).json();
    const alts = ((d.flows && d.flows.rows) || []).slice(1, 5);
    host.innerHTML = cap + (alts.length
      ? '<table><tbody>' + alts.map(a => '<tr><td>' + esc(a.partner_name) + '</td>' +
          '<td class="r" style="width:58px">' + pct(a.share_of_total_pct, 1) + '</td>' +
          '<td class="r" style="width:62px">' + usd(a.value_usd) + '</td>' +
          '<td class="r" style="width:74px">' + (tonnes(a.net_weight_kg) || "—") + '</td></tr>').join("") +
        '</tbody></table><div class="after">Shipping to Ukraine now, so capacity is demonstrated rather than hypothetical.</div>'
      : '<div class="note" style="margin-top:6px">No second origin of any size reports on this line.</div>');
  } catch (e) {
    host.innerHTML = cap + '<div class="note" style="margin-top:6px">unavailable</div>';
  }
}

async function load(refresh) {
  $("list").innerHTML = Array.from({length: 4}, () => '<div class="sk"></div>').join("");
  try {
    data = await (await fetch("/api/portfolio?year=2024" + (refresh ? "&refresh=true" : ""))).json();
    fields(); renderList();
  } catch (e) {
    $("list").innerHTML = '<div class="entry s-stamp" style="cursor:default"><div class="body"><span class="note">Could not load: ' + esc(e) + '</span></div></div>';
  }
}

/* ---------------- line sheet ---------------- */
function view(v) {
  $("vList").classList.toggle("hide", v !== "list");
  $("vLine").classList.toggle("hide", v !== "line");
  window.scrollTo({ top: 0 });
}

async function openLine(hs) {
  const row = data.rows.find(r => r.hs_code === hs);
  view("line");
  $("crumb").textContent = row ? shortName(row).toUpperCase() : hs;
  $("lineBody").innerHTML = '<div class="note" style="padding:14px 0">Loading&#8230;</div>';
  const d = await (await fetch("/api/commodity/" + hs + "?year=2024")).json();
  const flows = d.flows || {}, risk = d.risk || {};
  const rows = flows.rows || [];
  const all = conds(row || {});

  $("lineBody").innerHTML =
  '<div class="sheet"><div class="cap"><span class="t">Origins declared</span>' +
    '<span class="code">HS ' + esc(d.hs_code) + '</span>' +
    '<span class="grow"></span>' +
    '<span class="note">' + esc(period((flows.provenance || {}).as_of || data.period_label)) +
    ' · ' + rows.length + ' reporting' +
    (all.length ? ' · ' + all.map(c => esc(c.w)).join(", ") : "") + '</span></div>' +
    '<table class="man"><thead><tr><th class="eb">Origin</th><th class="r eb">Share</th>' +
    '<th class="r eb">Value</th><th class="r eb">Weight</th><th class="r eb">Unit value</th></tr></thead><tbody>' +
    rows.map((r,i) => '<tr><td>' + esc(r.partner_name) + ' <span class="code">' + esc(r.partner_iso3) + '</span>' +
      (i === 0 ? ' <span class="lead-tag">lead</span>' : "") + '</td>' +
      '<td class="r n">' + pct(r.share_of_total_pct,1) + '</td>' +
      '<td class="r n">' + usd(r.value_usd) + '</td>' +
      '<td class="r">' + (tonnes(r.net_weight_kg) || "—") + '</td>' +
      '<td class="r">' + (r.unit_price_usd_per_kg == null ? "—" : "$" + r.unit_price_usd_per_kg.toFixed(2)) + '</td></tr>').join("") +
    '</tbody></table>' +
    '<details><summary>How these figures were made</summary><div class="bd">' +
      (risk.interpretation ? '<p style="margin:0 0 10px">' + esc(risk.interpretation) + '</p>' : "") +
      ((flows.notes||[]).length ? '<div class="flag">' + (flows.notes||[]).map(esc).join("<br>") + '</div>' : "") +
      '<p class="note" style="margin:10px 0 0">Unit value is declared value over declared weight, not a quoted price.</p>' +
    '</div></details></div>' +

  '<div class="sheet"><div class="cap"><span class="t">Find better options</span></div><div class="bd">' +
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      '<button class="go" id="run">Run</button>' +
      '<label class="note"><input type="checkbox" id="optReplay"> offline</label>' +
      '<label class="note"><input type="checkbox" id="optPw" checked> browser server</label>' +
      '<span class="grow"></span>' +
      '<button id="breakPw">Break browser server</button></div>' +
    '<p class="note" id="runNote" style="margin:11px 0 0">Ranks alternative origins on landed cost, ' +
    'logistics, duty and demonstrated supply. Several minutes.</p>' +
    '<div class="out" id="out" style="margin-top:13px"></div></div>' +
    '<details id="logWrap" class="hide"><summary>Steps</summary><div class="bd log" id="log"></div></details></div>';

  $("run").addEventListener("click", () => run(d));
  $("breakPw").addEventListener("click", () => run(d, { broken: true }));
}

function run(d, opts) {
  opts = opts || {};
  const q = "Where should Ukraine source " + d.label + " (HS " + d.hs_code + ") from? " +
    "Assume a 120 tonne shipment. If current supply is concentrated, look beyond the incumbent leaders.";
  const p = new URLSearchParams({ question: q });
  if ($("optReplay").checked) p.set("replay", "true");
  if (!$("optPw").checked) p.set("playwright", "false");
  if (opts.broken) p.set("break_playwright", "true");

  $("out").textContent = ""; $("log").innerHTML = "";
  $("logWrap").classList.remove("hide"); $("logWrap").open = true;
  $("runNote").textContent = opts.broken ? "Failure demo — running…" : "Running…";
  $("run").disabled = true;

  stream("/api/run?" + p, {
    status: e => {
      const s = e.data && e.data.servers;
      $("runNote").textContent = s ? "Connected: " + Object.keys(s).join(", ") : (e.text || "working");
    },
    trace: e => {
      const bad = e.data && e.data.is_error;
      const div = document.createElement("div");
      if (bad) div.className = "bad";
      div.textContent = (e.kind === "tool_call" ? "›" : bad ? "×" : "✓") +
        " " + (e.server||"") + "." + (e.tool||"");
      $("log").appendChild(div);
    },
    text: e => { $("out").textContent = e.text; },
    done: e => {
      const t = e.data || {};
      $("runNote").textContent = "Done · " + (t.turns == null ? "?" : t.turns) + " steps · " +
        Math.round((t.duration_ms||0)/1000) + "s" + (t.cost_usd ? " · $" + t.cost_usd.toFixed(2) : "");
      $("run").disabled = false;
    },
    error: e => { $("runNote").textContent = "Failed: " + e.text; $("run").disabled = false; },
  });
}

function stream(url, on) {
  if (live) live.close();
  const es = new EventSource(url); live = es;
  es.onmessage = m => {
    const e = JSON.parse(m.data);
    const h = { status: on.status, tool_call: on.trace, tool_result: on.trace,
                text: on.text, done: on.done, error: on.error }[e.kind];
    if (h) h(e);
  };
  const close = () => { es.close(); if (live === es) live = null; };
  es.addEventListener("end", close); es.onerror = close;
}

/* ---------------- ask ---------------- */
const ctx = () => !data ? "" :
  "Lines on screen (" + period(data.period_label) + ", UN Comtrade via the trade-sourcing MCP server):\n" +
  data.rows.map(r => r.label + " (HS " + r.hs_code + "): " + usd(r.total_value_usd) + " imports, lead " +
    r.top_partner_iso3 + " " + pct(r.top_partner_share_pct,1) + ", " + usd(atRisk(r)) + " with the lead, " +
    "effective origins " + n(r.effective_partner_count,1) + ", conditions " +
    ((r.flags||[]).join("/") || "none")).join("\n");

function send() {
  const q = $("ask").value.trim(); if (!q) return;
  $("ask").value = "";
  const w = document.createElement("div");
  w.innerHTML = '<div class="q">' + esc(q) + '</div><div class="a">…</div>';
  $("qa").appendChild(w);
  const a = w.querySelector(".a");
  $("askBtn").disabled = true;
  stream("/api/chat?question=" + encodeURIComponent(q) + "&context=" + encodeURIComponent(ctx()), {
    trace: e => { if (e.kind === "tool_call") a.textContent = "checking " + e.tool + "…"; },
    text: e => { a.textContent = e.text; },
    done: () => { $("askBtn").disabled = false; },
    error: e => { a.textContent = "failed: " + e.text; $("askBtn").disabled = false; },
  });
}

async function sources() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("sysBody").innerHTML = Object.entries(h.servers).map(kv =>
      '<div style="margin-bottom:9px"><span class="code" style="color:var(--ink)">' + esc(kv[0]) + '</span>' +
      '<span class="note"> ' + esc(kv[1].transport) + " · " + kv[1].declared_tools.length + ' tools</span>' +
      '<div class="note">' + kv[1].declared_tools.map(esc).join(", ") + '</div></div>').join("") +
      '<div class="note">mode ' + esc(h.data_mode) + " · model " + esc(h.model) +
      " · credential " + esc(h.credential) + '</div>';
  } catch (e) { $("sysBody").textContent = String(e); }
}

$("segAll").addEventListener("click", () => { riskOnly = false; renderList(); });
$("segRisk").addEventListener("click", () => { riskOnly = true; renderList(); });
$("refresh").addEventListener("click", () => load(true));
$("back").addEventListener("click", () => view("list"));
$("askBtn").addEventListener("click", send);
$("ask").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("sysBtn").addEventListener("click", () => {
  view("list"); $("sysWrap").open = !$("sysWrap").open;
  if ($("sysWrap").open) $("sysWrap").scrollIntoView({ block: "center" });
});

sources(); load();
</script>
