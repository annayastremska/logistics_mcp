<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sourcing Risk</title>
<style>
  /* ===================================================================
     One job: show a buyer which import lines depend on a single country,
     what that dependency is worth, and where else the goods already come
     from. Everything on screen answers one of those three; anything that
     answered none of them was removed.

     Cards, but not the template kind. What was cut, and why:
       hero headline with one coloured word -> a strip of measured facts
       six identical tiles of equal weight -> the worst line leads, at size
       drop shadows / blur / gradients     -> hairlines, flat surfaces
       hover lift                          -> border and tint only
       filled status pills                 -> a rule plus a word
       Inter                               -> the platform UI face

     Contrast was measured, not judged: every text token clears 4.5:1 on
     both surfaces in both modes; interactive borders clear 3:1.
     =================================================================== */
  :root {
    color-scheme: light;
    --bg: #ffffff; --sunk: #f7f7f5; --hover: #f2f2ef;
    --ink: #16150f; --ink-2: #5c5a52; --ink-3: #8f8d84;
    --line: #e6e4dd; --control: #8f8d84;
    --sel: #1a4f8a;
    --crit: #b3261e; --high: #a2560f; --mod: #7a6a12; --ok: #1d6b2b;
    --track: #e3e1d9;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #17171a; --sunk: #1e1e21; --hover: #26262a;
      --ink: #f2f1ec; --ink-2: #a8a69e; --ink-3: #7c7a73;
      --line: #2b2b2f; --control: #7c7a73; --sel: #7fb0ea;
      --crit: #f08a82; --high: #e0a457; --mod: #cfc05a; --ok: #79c489;
      --track: #303034;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17171a; --sunk: #1e1e21; --hover: #26262a;
    --ink: #f2f1ec; --ink-2: #a8a69e; --ink-3: #7c7a73;
    --line: #2b2b2f; --control: #7c7a73; --sel: #7fb0ea;
    --crit: #f08a82; --high: #e0a457; --mod: #cfc05a; --ok: #79c489;
    --track: #303034;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column;
    font: 13px/1.45 -apple-system, "Segoe UI Variable Text", "Segoe UI",
          ui-sans-serif, system-ui, "Helvetica Neue", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  h1,h2,h3 { margin: 0; font-weight: 600; letter-spacing: -0.008em; }
  :focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }

  /* one measured column; every element aligns to its text edge */
  .wrap { max-width: 1180px; margin: 0 auto; width: 100%; padding: 0 20px; }

  header { border-bottom: 1px solid var(--line); }
  header .wrap { height: 46px; display: flex; align-items: center; gap: 12px; }
  .name { font-weight: 600; }
  .name i { font-style: normal; color: var(--ink-3); font-weight: 400; margin-left: 8px; }
  .grow { flex: 1; }

  button {
    appearance: none; font: inherit; cursor: pointer; height: 27px; padding: 0 11px;
    border: 1px solid var(--control); border-radius: 4px; background: var(--bg); color: var(--ink);
  }
  button:hover { background: var(--hover); }
  button.q { border-color: transparent; background: none; color: var(--ink-2); }
  button.q:hover { background: var(--hover); color: var(--ink); }
  button.go { background: var(--sel); border-color: var(--sel); color: #fff; font-weight: 500; }
  :root[data-theme="dark"] button.go { color: #14141a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.go { color: #14141a; } }
  button:disabled { opacity: .45; cursor: default; }

  /* ---------- portfolio state, as facts ---------- */
  .strip { border-bottom: 1px solid var(--line); background: var(--sunk); }
  .strip .wrap { display: flex; flex-wrap: wrap; }
  .fact { padding: 10px 22px 10px 0; margin-right: 22px; border-right: 1px solid var(--line); }
  .fact:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
  .fact .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
  .fact .v { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; margin-top: 1px; }
  .fact .v s { text-decoration: none; font-size: 11.5px; font-weight: 400; color: var(--ink-2); margin-left: 5px; letter-spacing: 0; }
  .fact.key .v { color: var(--crit); }

  .tools { display: flex; align-items: center; gap: 10px; padding: 13px 0 14px; }
  .seg { display: inline-flex; border: 1px solid var(--control); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; height: 25px; color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--sunk); color: var(--ink); font-weight: 550; }
  .cnt { font-size: 12px; color: var(--ink-3); }

  /* ---------- cards, with hierarchy ---------- */
  .grid {
    display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1px;
    /* Dense, so the lead card spanning two columns cannot leave a hole at the
       end of the grid -- an empty cell shows the grid background and reads as
       a grey slab. */
    grid-auto-flow: row dense;
    background: var(--line); border: 1px solid var(--line); border-radius: 5px; overflow: hidden;
  }
  @media (max-width: 880px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 580px) { .grid { grid-template-columns: minmax(0,1fr); } }

  .card {
    appearance: none; font: inherit; text-align: left; cursor: pointer;
    background: var(--bg); border: 0; border-radius: 0; height: auto;
    padding: 14px 16px 15px; position: relative;
    /* A button centres its own contents, and display:block does not undo it --
       a short card in a tall row floated in the middle of its cell. */
    display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
  }
  .card:hover { background: var(--hover); }
  .card::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: currentColor; }
  /* Unequal risk should not get equal weight. The worst line takes two
     columns and answers the next question -- where else? -- without a click. */
  /* Two columns and two rows: with six lines in three columns that tiles
     exactly, so hierarchy costs no empty cells. */
  .card.lead { grid-column: span 2; grid-row: span 2; }
  @media (max-width: 880px) { .card.lead { grid-column: span 2; grid-row: span 1; } }
  @media (max-width: 580px) { .card.lead { grid-column: span 1; grid-row: span 1; } }

  .c-crit { color: var(--crit); } .c-high { color: var(--high); }
  .c-mod { color: var(--mod); }   .c-ok { color: var(--ok); }

  .top { display: flex; align-items: baseline; gap: 8px; }
  .nm { font-size: 14px; font-weight: 600; color: var(--ink); }
  .hs { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .gp { margin-left: auto; font-size: 11px; color: var(--ink-3); }

  .big { display: flex; align-items: baseline; gap: 6px; margin-top: 13px; }
  .big em { font-style: normal; font-size: 26px; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); line-height: 1; }
  .card.lead .big em { font-size: 34px; }
  .big span { font-size: 12px; color: var(--ink-2); }
  .who { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
  .who b { color: var(--ink); font-weight: 600; }

  .track { height: 3px; background: var(--track); margin-top: 12px; }
  .track i { display: block; height: 100%; background: currentColor; }

  .st { display: flex; align-items: baseline; gap: 7px; font-size: 12px; margin-top: 12px; }
  .st b { font-weight: 550; color: var(--ink); }
  .st s { text-decoration: none; color: var(--ink-3); }

  .kv { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 12px 0 0; padding-top: 11px; border-top: 1px solid var(--line); }
  .kv dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
  .kv dd { margin: 2px 0 0; font-size: 13px; font-weight: 550; color: var(--ink); }
  .kv dd small { display: block; font-size: 11px; font-weight: 400; color: var(--ink-3); margin-top: 1px; }

  .alts { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); }
  .card.lead .alts { margin-top: auto; }
  .alts .h { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; margin-bottom: 7px; }
  .alts table { width: 100%; border-collapse: collapse; }
  .alts td { padding: 2px 0; font-size: 12.5px; color: var(--ink-2); }
  .alts td.r { text-align: right; color: var(--ink); }

  /* ---------- one line ---------- */
  .crumbs { display: flex; align-items: center; gap: 9px; padding: 11px 0; font-size: 12px; color: var(--ink-3); }
  .block { border: 1px solid var(--line); border-radius: 5px; margin-bottom: 12px; }
  .block .hd { padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--sunk); font-size: 12px; font-weight: 600; }
  .block .bd { padding: 14px; }
  table.data { width: 100%; border-collapse: collapse; }
  table.data th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  table.data td { padding: 0 14px; height: 34px; border-bottom: 1px solid var(--line); }
  table.data tr:last-child td { border-bottom: 0; }
  .r { text-align: right; }
  .sub { font-size: 11.5px; color: var(--ink-3); }

  details { border-top: 1px solid var(--line); }
  details summary { list-style: none; cursor: pointer; padding: 9px 14px; font-size: 12px; color: var(--ink-2); display: flex; gap: 7px; align-items: center; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "+"; font-family: var(--mono); color: var(--ink-3); }
  details[open] summary::before { content: "\2212"; }
  details summary:hover { color: var(--ink); background: var(--hover); }
  details .bd { padding: 4px 14px 14px; }

  .note { font-size: 11.5px; color: var(--ink-3); }
  .warn { border-left: 2px solid var(--mod); padding: 8px 11px; font-size: 11.5px; color: var(--ink-2); background: var(--sunk); }
  .log { font-family: var(--mono); font-size: 11.5px; }
  .log div { padding: 2px 0; color: var(--ink-2); }
  .log .bad { color: var(--crit); }
  .out { white-space: pre-wrap; font-size: 13px; line-height: 1.55; }

  .ask { border-top: 1px solid var(--line); padding: 9px 0; margin-top: auto; }
  .ask .wrap { display: flex; gap: 8px; align-items: center; }
  .ask input { flex: 1; font: inherit; height: 29px; padding: 0 10px; border: 1px solid var(--control); border-radius: 4px; background: var(--bg); color: var(--ink); }
  .qa .q { font-size: 12px; color: var(--ink-3); margin-top: 12px; }
  .qa .a { font-size: 13px; white-space: pre-wrap; margin-top: 3px; }

  #main { flex: 1 1 auto; }
  .hide { display: none !important; }
  .sk { background: var(--sunk); height: 176px; }
</style>
</head>
<body>

<header><div class="wrap">
  <span class="name">Sourcing Risk <i id="period"></i></span>
  <span class="grow"></span>
  <button class="q" id="sysBtn">Sources</button>
</div></header>

<div class="strip"><div class="wrap" id="strip"></div></div>

<div id="main">
  <section id="vList" class="wrap">
    <div class="tools">
      <div class="seg">
        <button id="segAll" aria-pressed="true">All</button>
        <button id="segRisk" aria-pressed="false">Needs attention</button>
      </div>
      <span class="cnt" id="cnt"></span>
      <span class="grow"></span>
      <button class="q" id="refresh">Refresh</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="block" style="margin-top:14px">
      <details id="sysWrap"><summary>Data sources and connections</summary>
        <div class="bd" id="sysBody">checking&#8230;</div></details>
    </div>
  </section>

  <section id="vLine" class="wrap hide">
    <div class="crumbs"><button class="q" id="back">&#8592; Lines</button><span id="crumb"></span></div>
    <div id="lineBody"></div>
  </section>
</div>

<div class="wrap qa" id="qa"></div>
<div class="ask"><div class="wrap">
  <input id="ask" placeholder="Ask about these lines" autocomplete="off">
  <button class="go" id="askBtn">Ask</button>
</div></div>

<script>
"use strict";

/* Server enums are not buyer language. Each maps to a word that can be acted
   on, a severity, and whether it belongs on the card face -- the rest surface
   on the line view. Four badges on a tile is how the last version became
   unreadable. */
const COND = {
  SINGLE_SOURCE:          { w: "Single source", c: "c-crit", rank: 4, face: true,
                            why: "One country supplies over 70% of this line." },
  HIGH_CONCENTRATION:     { w: "Concentrated",  c: "c-high", rank: 3, face: true,
                            why: "Supply sits with very few countries." },
  MODERATE_CONCENTRATION: { w: "Moderate",      c: "c-mod",  rank: 2, face: true,
                            why: "Supply is moderately concentrated." },
  VOLATILE_SUPPLY:        { w: "Volumes swing", c: "c-mod",  rank: 2, face: false,
                            why: "Volumes move sharply year to year." },
  MIRROR_DISCREPANCY:     { w: "Reporting gap", c: "c-mod",  rank: 1, face: false,
                            why: "Partner export reports disagree with Ukraine's import figures." },
  THIN_DATA:              { w: "Thin data",     c: "c-mod",  rank: 1, face: false,
                            why: "Too few reporting origins to be confident." },
};

const ATTENTION = 4;     // single-source. "Any flag" matched all six rows.
let data = null, riskOnly = false, live = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const usd = (v) => v == null ? "—"
  : v >= 1e9 ? "$" + (v/1e9).toFixed(1) + "bn"
  : v >= 1e6 ? "$" + (v/1e6).toFixed(0) + "m"
  : v >= 1e3 ? "$" + (v/1e3).toFixed(0) + "k" : "$" + v.toFixed(0);
const pct = (v, d = 0) => v == null ? "—" : v.toFixed(d) + "%";
const n = (v, d = 0) => v == null ? "—" : v.toLocaleString("en-US", { maximumFractionDigits: d });

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const period = (l) => {
  if (!l) return "";
  const one = p => MON[+p.slice(4)-1] + " " + p.slice(2,4);
  const m = String(l).match(/^(\d{6})-(\d{6})$/);
  return m ? one(m[1]) + "–" + one(m[2]) : String(l);
};

/* Money the lead supplier controls. Ranking on share alone puts a $19m line
   above a $231m one, which is backwards for allocating attention. */
const atRisk = (r) => (r.total_value_usd == null || r.top_partner_share_pct == null)
  ? null : r.total_value_usd * r.top_partner_share_pct / 100;
const conds = (r) => (r.flags || []).map(f => COND[f]).filter(Boolean).sort((a,b) => b.rank - a.rank);
const face = (r) => conds(r).find(c => c.face) || null;
const shortName = (r) => r.label.replace(/,\s*(fresh|shelled|in shell)$/i, "");

/* ---------------- portfolio state ---------------- */
function strip() {
  const rows = data.rows.filter(r => r.top_partner_share_pct != null);
  const total = rows.reduce((s,r) => s + (r.total_value_usd||0), 0);
  const risk  = rows.reduce((s,r) => s + (atRisk(r)||0), 0);
  const byLead = {};
  rows.forEach(r => (byLead[r.top_partner_name || r.top_partner_iso3] ??= []).push(r));
  const top = Object.entries(byLead).sort((a,b) => b[1].length - a[1].length)[0];
  const topRisk = top ? top[1].reduce((s,r) => s + (atRisk(r)||0), 0) : 0;

  const f = (k, v, s, key) => '<div class="fact' + (key ? " key" : "") + '"><div class="k">' + k +
    '</div><div class="v">' + v + (s ? "<s>" + s + "</s>" : "") + "</div></div>";

  $("strip").innerHTML =
    f("Imports", usd(total), period(data.period_label)) +
    f("Held by one origin", usd(risk), total ? Math.round(risk/total*100) + "%" : "", true) +
    (top && top[1].length > 1
      ? f("Largest single origin", esc(top[0]), top[1].length + " lines · " + usd(topRisk))
      : "") +
    f("Needs attention", rows.filter(r => (r.severity||0) >= ATTENTION).length, "of " + rows.length);
  $("period").textContent = period(data.period_label);
}

/* ---------------- cards ---------------- */
const visible = () => data.rows
  .filter(r => !riskOnly || (r.severity||0) >= ATTENTION)
  .sort((a,b) => (b.severity - a.severity) || ((atRisk(b)||0) - (atRisk(a)||0)));

function card(r, isLead) {
  const h = face(r), cls = h ? h.c : "c-ok";
  const rest = conds(r).length - (h ? 1 : 0);
  const share = r.top_partner_share_pct;
  return '<button class="card ' + cls + (isLead ? " lead" : "") + '" data-hs="' + esc(r.hs_code) + '">' +
    '<div class="top"><span class="nm">' + esc(shortName(r)) + '</span>' +
      '<span class="hs">' + esc(r.hs_code) + '</span>' +
      '<span class="gp">' + esc(r.group) + (r.status !== "ok" ? " · incomplete" : "") + '</span></div>' +
    '<div class="big"><em>' + pct(share) + '</em><span>from one origin</span></div>' +
    '<div class="who"><b>' + esc(r.top_partner_name || r.top_partner_iso3 || "—") + '</b> leads</div>' +
    '<div class="track"><i style="width:' + Math.min(100, share||0) + '%"></i></div>' +
    '<div class="st"><b>' + (h ? h.w : "Spread") + '</b>' + (rest > 0 ? '<s>+' + rest + '</s>' : "") + '</div>' +
    '<dl class="kv">' +
      '<div><dt>At risk</dt><dd>' + usd(atRisk(r)) + '</dd></div>' +
      '<div><dt>Real alternatives</dt><dd>' + n(r.effective_partner_count,1) +
        '<small>' + n(r.partner_count) + ' report, this many matter</small></dd></div>' +
      (isLead ? '<div><dt>Imports</dt><dd>' + usd(r.total_value_usd) + '</dd></div>' +
                '<div><dt>Volume swing</dt><dd>' + pct(r.yoy_volatility_pct,0) +
                '<small>year to year</small></dd></div>' : "") +
    '</dl>' +
    (isLead ? '<div class="alts" id="alts-' + esc(r.hs_code) + '">' +
              '<div class="h">Where else it already comes from</div>' +
              '<div class="note">loading…</div></div>' : "") +
    '</button>';
}

function renderCards() {
  const rows = visible();
  $("grid").innerHTML = rows.length
    ? rows.map((r,i) => card(r, i === 0)).join("")
    : '<div class="card" style="cursor:default"><span class="note">No line matches.</span></div>';
  $("cnt").textContent = rows.length + " of " + data.rows.length;
  $("segAll").setAttribute("aria-pressed", String(!riskOnly));
  $("segRisk").setAttribute("aria-pressed", String(riskOnly));
  $("grid").querySelectorAll(".card[data-hs]").forEach(el =>
    el.addEventListener("click", () => openLine(el.dataset.hs)));
  if (rows[0]) fillAlts(rows[0].hs_code);
}

/* The lead card earns its width by answering "where else?" up front. */
async function fillAlts(hs) {
  const host = $("alts-" + hs);
  if (!host) return;
  const title = '<div class="h">Where else it already comes from</div>';
  try {
    const d = await (await fetch("/api/commodity/" + hs + "?year=2024")).json();
    const alts = (d.flows && d.flows.rows ? d.flows.rows : []).slice(1, 5);
    host.innerHTML = title + (alts.length
      ? '<table><tbody>' + alts.map(a => '<tr><td>' + esc(a.partner_name) + '</td>' +
          '<td class="r" style="width:56px">' + pct(a.share_of_total_pct,1) + '</td>' +
          '<td class="r" style="width:58px">' + usd(a.value_usd) + '</td></tr>').join("") +
        '</tbody></table><div class="note" style="margin-top:6px">' +
        'Already shipping to Ukraine, so capacity is demonstrated, not hypothetical.</div>'
      : '<div class="note">No meaningful second origin reports on this line.</div>');
  } catch (e) {
    host.innerHTML = title + '<div class="note">unavailable</div>';
  }
}

async function load(refresh) {
  $("grid").innerHTML = Array.from({length: 6}, () => '<div class="sk"></div>').join("");
  try {
    data = await (await fetch("/api/portfolio?year=2024" + (refresh ? "&refresh=true" : ""))).json();
    strip(); renderCards();
  } catch (e) {
    $("grid").innerHTML = '<div class="card" style="cursor:default"><span class="note">Could not load: ' + esc(e) + '</span></div>';
  }
}

/* ---------------- one line ---------------- */
function view(v) {
  $("vList").classList.toggle("hide", v !== "list");
  $("vLine").classList.toggle("hide", v !== "line");
  window.scrollTo({ top: 0 });
}

async function openLine(hs) {
  const row = data.rows.find(r => r.hs_code === hs);
  view("line");
  $("crumb").textContent = row ? row.label : hs;
  $("lineBody").innerHTML = '<div class="note" style="padding:14px 0">Loading…</div>';
  const d = await (await fetch("/api/commodity/" + hs + "?year=2024")).json();
  const flows = d.flows || {}, risk = d.risk || {};
  const rows = flows.rows || [];
  const all = conds(row || {});

  $("lineBody").innerHTML =
  '<div class="block"><div class="hd">Where it comes from ' +
    '<span class="note" style="font-weight:400">' +
    esc(period((flows.provenance || {}).as_of || data.period_label)) + " · HS " + esc(d.hs_code) +
    " · " + rows.length + " origins reporting" +
    (all.length ? " · " + all.map(c => esc(c.w)).join(", ") : "") + '</span></div>' +
    '<table class="data"><thead><tr><th>Origin</th><th class="r">Share</th><th class="r">Value</th>' +
    '<th class="r">Weight</th><th class="r">Unit value</th></tr></thead><tbody>' +
    rows.map((r,i) => '<tr><td>' + esc(r.partner_name) + ' <span class="hs">' + esc(r.partner_iso3) + '</span>' +
      (i === 0 ? ' <span class="sub">lead</span>' : "") + '</td>' +
      '<td class="r">' + pct(r.share_of_total_pct,1) + '</td>' +
      '<td class="r">' + usd(r.value_usd) + '</td>' +
      '<td class="r">' + (r.net_weight_kg == null ? "—" : n(r.net_weight_kg/1000) + " t") + '</td>' +
      '<td class="r">' + (r.unit_price_usd_per_kg == null ? "—" : "$" + r.unit_price_usd_per_kg.toFixed(2)) + '</td></tr>').join("") +
    '</tbody></table>' +
    '<details><summary>How these numbers were made</summary><div class="bd">' +
      (risk.interpretation ? '<p style="margin:0 0 9px">' + esc(risk.interpretation) + '</p>' : "") +
      ((flows.notes||[]).length ? '<div class="warn">' + (flows.notes||[]).map(esc).join("<br>") + '</div>' : "") +
      '<p class="note" style="margin:9px 0 0">Unit value is value over weight, not a quoted price.</p>' +
    '</div></details></div>' +

  '<div class="block"><div class="hd">Find better options</div><div class="bd">' +
    '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">' +
      '<button class="go" id="run">Run</button>' +
      '<label class="note"><input type="checkbox" id="optReplay"> offline</label>' +
      '<label class="note"><input type="checkbox" id="optPw" checked> browser server</label>' +
      '<span class="grow"></span>' +
      '<button id="breakPw">Break browser server</button></div>' +
    '<p class="note" id="runNote" style="margin:10px 0 0">Ranks alternative origins on landed cost, ' +
    'logistics, duty and demonstrated supply. Several minutes.</p>' +
    '<div class="out" id="out" style="margin-top:12px"></div></div>' +
    '<details id="logWrap" class="hide"><summary>Steps</summary><div class="bd log" id="log"></div></details></div>';

  $("run").addEventListener("click", () => run(d));
  $("breakPw").addEventListener("click", () => run(d, { broken: true }));
}

function run(d, opts) {
  opts = opts || {};
  const q = "Where should Ukraine source " + d.label + " (HS " + d.hs_code + ") from? " +
    "Assume a 120 tonne shipment. If current supply is concentrated, look beyond the incumbent leaders.";
  const p = new URLSearchParams({ question: q });
  if ($("optReplay").checked) p.set("replay", "true");
  if (!$("optPw").checked) p.set("playwright", "false");
  if (opts.broken) p.set("break_playwright", "true");

  $("out").textContent = ""; $("log").innerHTML = "";
  $("logWrap").classList.remove("hide"); $("logWrap").open = true;
  $("runNote").textContent = opts.broken ? "Failure demo — running…" : "Running…";
  $("run").disabled = true;

  stream("/api/run?" + p, {
    status: e => {
      const s = e.data && e.data.servers;
      $("runNote").textContent = s ? "Connected: " + Object.keys(s).join(", ") : (e.text || "working");
    },
    trace: e => {
      const bad = e.data && e.data.is_error;
      const div = document.createElement("div");
      if (bad) div.className = "bad";
      div.textContent = (e.kind === "tool_call" ? "›" : bad ? "×" : "✓") +
        " " + (e.server||"") + "." + (e.tool||"");
      $("log").appendChild(div);
    },
    text: e => { $("out").textContent = e.text; },
    done: e => {
      const t = e.data || {};
      $("runNote").textContent = "Done · " + (t.turns == null ? "?" : t.turns) + " steps · " +
        Math.round((t.duration_ms||0)/1000) + "s" + (t.cost_usd ? " · $" + t.cost_usd.toFixed(2) : "");
      $("run").disabled = false;
    },
    error: e => { $("runNote").textContent = "Failed: " + e.text; $("run").disabled = false; },
  });
}

function stream(url, on) {
  if (live) live.close();
  const es = new EventSource(url); live = es;
  es.onmessage = m => {
    const e = JSON.parse(m.data);
    const h = { status: on.status, tool_call: on.trace, tool_result: on.trace,
                text: on.text, done: on.done, error: on.error }[e.kind];
    if (h) h(e);
  };
  const close = () => { es.close(); if (live === es) live = null; };
  es.addEventListener("end", close); es.onerror = close;
}

/* ---------------- ask ---------------- */
const ctx = () => !data ? "" :
  "Lines on screen (" + period(data.period_label) + ", UN Comtrade via the trade-sourcing MCP server):\n" +
  data.rows.map(r => r.label + " (HS " + r.hs_code + "): " + usd(r.total_value_usd) + " imports, lead " +
    r.top_partner_iso3 + " " + pct(r.top_partner_share_pct,1) + ", " + usd(atRisk(r)) + " with the lead, " +
    "effective origins " + n(r.effective_partner_count,1) + ", conditions " +
    ((r.flags||[]).join("/") || "none")).join("\n");

function send() {
  const q = $("ask").value.trim(); if (!q) return;
  $("ask").value = "";
  const w = document.createElement("div");
  w.innerHTML = '<div class="q">' + esc(q) + '</div><div class="a">…</div>';
  $("qa").appendChild(w);
  const a = w.querySelector(".a");
  $("askBtn").disabled = true;
  stream("/api/chat?question=" + encodeURIComponent(q) + "&context=" + encodeURIComponent(ctx()), {
    trace: e => { if (e.kind === "tool_call") a.textContent = "checking " + e.tool + "…"; },
    text: e => { a.textContent = e.text; },
    done: () => { $("askBtn").disabled = false; },
    error: e => { a.textContent = "failed: " + e.text; $("askBtn").disabled = false; },
  });
}

async function sources() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("sysBody").innerHTML = Object.entries(h.servers).map(kv =>
      '<div style="margin-bottom:8px"><span class="log" style="color:var(--ink)">' + esc(kv[0]) + '</span>' +
      '<span class="note"> ' + esc(kv[1].transport) + " · " + kv[1].declared_tools.length + ' tools</span>' +
      '<div class="note">' + kv[1].declared_tools.map(esc).join(", ") + '</div></div>').join("") +
      '<div class="note">mode ' + esc(h.data_mode) + " · model " + esc(h.model) +
      " · credential " + esc(h.credential) + '</div>';
  } catch (e) { $("sysBody").textContent = String(e); }
}

$("segAll").addEventListener("click", () => { riskOnly = false; renderCards(); });
$("segRisk").addEventListener("click", () => { riskOnly = true; renderCards(); });
$("refresh").addEventListener("click", () => load(true));
$("back").addEventListener("click", () => view("list"));
$("askBtn").addEventListener("click", send);
$("ask").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("sysBtn").addEventListener("click", () => {
  view("list"); $("sysWrap").open = !$("sysWrap").open;
  if ($("sysWrap").open) $("sysWrap").scrollIntoView({ block: "center" });
});

sources(); load();
</script>
