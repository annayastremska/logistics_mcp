  - main [ref=f1e67]:
    - heading "Статистика зовнішнього сектору" [level=1] [ref=f1e68]
    - generic [ref=f1e69]:
      - generic [ref=f1e72]:
        - heading "Статистика зовнішнього сектору" [level=2] [ref=f1e74]
        - generic [ref=f1e76]:
          - paragraph [ref=f1e77]: Національний банк складає статистику зовнішнього сектору, щоб відобразити участь України в міжнародному обміні товарами, послугами та капіталом. Статистика зовнішнього сектору висвітлює інформацію про економічні відносини України з рештою країн світу. Статистична база даних Національного банку використовується для прийняття рішень з економічної політики України.
          - paragraph [ref=f1e78]: "Національний банк складає статистику зовнішнього сектору за такими напрямками:"
          - list [ref=f1e79]:
            - listitem [ref=f1e80]: Платіжний баланс – це сукупність економічних операцій, які проводяться між резидентами та нерезидентами за певний період часу (рік, квартал, місяць). Платіжний баланс надається у формі статистичного звіту. Квартальні дані платіжного балансу публікуються на 75-80-ий день після звітного періоду. Якщо дані уточнювали, змінювалась методологія, виникли нові джерела інформації – дані за попередні періоди переглядаються. Річні дані стають остаточними через дев’ять місяців після закінчення звітного року. Місячні дані публікуються на 25-30-ий день після кінця звітного місяця. Квартальні дані більш деталізовані, ніж місячні. Після оприлюднення квартальних даних місячні дані коригуються для узгодження з ними.
          - list [ref=f1e81]:
            - listitem [ref=f1e82]: Прямі іноземні інвестиції визначаються як транскордонні інвестиції в підприємства з метою встановлення контролю чи стійкого впливу на діяльність підприємства, що досягається шляхом участі в капіталі. Статистика прямих іноземних інвестицій включає дані щодо потоків, запасів та доходів, які виникають між сторонами відносин прямого інвестування. Квартальні дані оприлюднюються на 85-90 день після закінчення звітного періоду, деталізовані дані регіонального розрізу - на 100-105 день після закінчення звітного періоду.
          - list [ref=f1e83]:
            - listitem [ref=f1e84]: Міжнародна інвестиційна позиція показує всі фінансові активи і зобов‘язання резидентів країни перед нерезидентами, що оцінюються за ринковими цінами станом на кінець кварталу. Відтак міжнародна інвестиційна позиція відображає не лише обсяг і структуру фінансових активів резидентів за кордоном, але й фінансових активів нерезидентів в Україні. Міжнародна інвестиційна позиція оприлюднюється один раз на квартал (на 82-85-ий день). Її оцінка переглядається ще протягом двох років після першої публікації. При цьому додаються коментарі про внесені зміни.
          - list [ref=f1e85]:
            - listitem [ref=f1e86]: Валовий зовнішній борг – це інформація про зовнішні зобов’язання країни на певну дату. Валовий зовнішній борг надається у формі статистичного звіту. Статистика валового зовнішнього боргу публікується один раз на квартал (на 75-80-ий день після звітного періоду). Дані переглядаються ще протягом п’яти кварталів після першої публікації. При цьому додаються коментарі про внесені зміни.
          - list [ref=f1e87]:
            - listitem [ref=f1e88]: Міжнародні резерви – це ліквідні фінансові активи держави, які можна реально використати на регулятивні та інші потреби, що мають загальноекономічне значення. Такі активи управляються та контролюються органами грошово-кредитного регулювання та визнаються світовим співтовариством як міжнародні.
          - list [ref=f1e89]:
            - listitem [ref=f1e90]:
              - text: Курси обміну валют.
              - strong [ref=f1e91]
              - text: Обмінний курс гривні формується під впливом ринкового попиту і пропозиції на іноземну валюту. Національний банк встановлює офіційний курс гривні до долара США за курсом, що розраховується як середньозважене значення його купівлі та продажу за всіма угодами між банками за день. Також ми встановлюємо офіційний курс гривні до інших іноземних валют, які широко використовуються для платежів за міжнародними операціями. Підтримання обмінного курсу гривні на певному рівні не є метою Національного банку.
          - paragraph [ref=f1e92]:
            - text: Статистика зовнішнього сектору складається на основі шостого видання
            - link "Керівництво з платіжного балансу та міжнародної інвестиційної позиції (МВФ, 2009)" [ref=f1e93] [cursor=pointer]:
              - /url: https://www.imf.org/external/pubs/ft/bop/2007/bopman6.htm
            - text: та
            - link "\"Статистики зовнішнього боргу. Керівництво для укладачів та користувачів\" (МВФ, 2013)" [ref=f1e94] [cursor=pointer]:
              - /url: http://tffs.org/pdf/edsg/ft2014.pdf
            - text: . Концептуальна основа статистики зовнішнього сектору погоджена з
            - link "Системою національних рахунків 2008" [ref=f1e95] [cursor=pointer]:
              - /url: https://unstats.un.org/unsd/nationalaccount/docs/SNA2008.pdf
            - text: ","
            - link "\"Керівництвом зі статистики державних фінансів\" (МВФ, 2014)" [ref=f1e96] [cursor=pointer]:
              - /url: http://www.imf.org/external/Pubs/FT/GFS/Manual/2014/gfsfinal.pdf
            - text: та
            - link "Керівництво з грошово-кредитної та фінансової статистики і довідника зі складання (МВФ, 2016)" [ref=f1e97] [cursor=pointer]:
              - /url: /admin_uploads/article/mfsmcg_merged-web.pdf
            - text: .
